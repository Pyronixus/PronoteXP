<!DOCTYPE html>
<html lang="fr">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>PronoteXP — Exporter</title>
    <link rel="stylesheet" href="style.css">
    <link rel="icon" type="image/png" sizes="32x32" href="assets/32.png">
    <link rel="icon" type="image/png" sizes="192x192" href="assets/192.png">
    <link rel="apple-touch-icon" sizes="192x192" href="assets/192.png">
    <script src="https://cdn.jsdelivr.net/npm/jsqr@1.4.0/dist/jsQR.js"></script>
</head>

<body>
    <div class="mesh"></div>
    <svg class="grain" xmlns="http://www.w3.org/2000/svg">
        <filter id="noise">
            <feTurbulence type="fractalNoise" baseFrequency="0.9" numOctaves="2" stitchTiles="stitch"></feTurbulence>
            <feColorMatrix type="saturate" values="0"></feColorMatrix>
        </filter>
        <rect width="100%" height="100%" filter="url(#noise)"></rect>
    </svg>

    <main class="app-card">
        <div class="brand">
            <span class="brand-title">PronoteXP</span>
        </div>
        <p class="subtitle">Extraction et sauvegarde locale de vos données PRONOTE</p>

        <div class="tab-bar" role="tablist">
            <button id="btn-tab-qr" role="tab" aria-selected="true" onclick="setTab('qr')" class="tab-button active">QR Code</button>
            <button id="btn-tab-token" role="tab" aria-selected="false" onclick="setTab('token')" class="tab-button">Jeton / URL</button>
            <button id="btn-tab-cred" role="tab" aria-selected="false" onclick="setTab('cred')" class="tab-button">Identifiants</button>
        </div>

        <div id="section-qr" class="section">
            <div class="field">
                <label for="qr-file">Fichier QR Code</label>
                <input type="file" id="qr-file" accept="image/*" onchange="readQRCodeImage(this)">
            </div>
            <div class="field">
                <label for="qr-pin">Code PIN (4 chiffres)</label>
                <input type="password" id="qr-pin" inputmode="numeric" pattern="[0-9]*" maxlength="4" autocomplete="off" placeholder="••••">
            </div>
        </div>

        <div id="section-token" class="section hidden">
            <div class="field">
                <label for="token-url">URL PRONOTE</label>
                <input type="url" id="token-url" placeholder="https://URL.index-education.net/pronote/eleve.html">
            </div>
            <div class="field">
                <label for="token-user">Identifiant Unique</label>
                <input type="text" id="token-user" autocomplete="off" placeholder="prenom.nom">
            </div>
            <div class="field">
                <label for="token-val">Jeton / Jeton de session</label>
                <input type="password" id="token-val" autocomplete="off" placeholder="Entrez le token PRONOTE">
            </div>
        </div>

        <div id="section-cred" class="section hidden">
            <div class="field">
                <label for="cred-url">URL PRONOTE</label>
                <input type="url" id="cred-url" placeholder="https://URL.index-education.net/pronote/eleve.html">
            </div>
            <div class="field">
                <label for="cred-ent">ENT</label>
                <select id="cred-ent">
                    <option value="monlycee_net">MonLycée.net (Île-de-France / Yvelines)</option>
                    <option value="ac_versailles">Académie de Versailles</option>
                    <option value="open_ent_ng">Open ENT NG</option>
                    <option value="">PRONOTE Direct (Sans ENT)</option>
                </select>
            </div>
            <div class="field">
                <label for="cred-user">Identifiant</label>
                <input type="text" id="cred-user" autocomplete="off" placeholder="prenom.nom">
            </div>
            <div class="field">
                <label for="cred-pass">Mot de passe</label>
                <input type="password" id="cred-pass" autocomplete="off" placeholder="••••••••">
            </div>
        </div>

        <div class="actions">
            <button id="btn-export" onclick="startExport()" class="btn primary">Exporter les données</button>
            <a id="btn-download" download="export_pronote.json" class="btn success hidden">Télécharger export_pronote.json</a>
        </div>

        <p id="status" role="status" aria-live="polite"></p>
    </main>
</body>
<script src="script.js"></script>
</html>
