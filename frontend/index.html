<!DOCTYPE html>
<html lang="fr" class="dark">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>PronoteXP — Exporter</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <script src="https://cdn.jsdelivr.net/npm/jsqr@1.4.0/dist/jsQR.js"></script>
    <style>
        @import url('https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700&display=swap');
        body { font-family: 'Inter', sans-serif; }
        .glass {
            background: rgba(15, 23, 42, 0.75);
            backdrop-filter: blur(16px);
            border: 1px solid rgba(255, 255, 255, 0.08);
        }
    </style>
</head>
<body class="bg-slate-950 text-slate-100 min-h-screen flex items-center justify-center p-4 relative overflow-hidden">

    <div class="absolute -top-40 -left-40 w-96 h-96 bg-blue-600/20 rounded-full blur-3xl pointer-events-none"></div>
    <div class="absolute -bottom-40 -right-40 w-96 h-96 bg-indigo-600/20 rounded-full blur-3xl pointer-events-none"></div>

    <div class="max-w-md w-full glass rounded-3xl p-8 shadow-2xl z-10 relative">
        <div class="flex items-center justify-center gap-2 mb-1">
            <span class="text-2xl font-black bg-gradient-to-r from-blue-400 to-indigo-400 bg-clip-text text-transparent">PronoteXP</span>
        </div>
        <p class="text-xs text-slate-400 text-center mb-6">Extraction et sauvegarde locale de vos données PRONOTE</p>

        <div class="grid grid-cols-3 gap-1 rounded-xl bg-slate-950/60 p-1 mb-6 border border-white/5">
            <button id="btn-tab-qr" onclick="setTab('qr')" class="py-2 text-xs font-medium rounded-lg bg-blue-600 text-white transition-all duration-200">
                QR Code
            </button>
            <button id="btn-tab-token" onclick="setTab('token')" class="py-2 text-xs font-medium rounded-lg text-slate-400 hover:text-white transition-all duration-200">
                Jeton / URL
            </button>
            <button id="btn-tab-cred" onclick="setTab('cred')" class="py-2 text-xs font-medium rounded-lg text-slate-400 hover:text-white transition-all duration-200">
                Identifiants
            </button>
        </div>

        <div id="section-qr" class="space-y-4">
            <div>
                <label class="block text-xs font-medium text-slate-300 mb-1.5">Fichier QR Code</label>
                <input type="file" id="qr-file" accept="image/*" onchange="readQRCodeImage(this)"
                       class="w-full text-xs text-slate-400 file:mr-3 file:py-2 file:px-4 file:rounded-lg file:border-0 file:text-xs file:font-semibold file:bg-blue-600/30 file:text-blue-300 hover:file:bg-blue-600/50 cursor-pointer bg-slate-950/80 border border-slate-800 rounded-xl">
            </div>

            <div>
                <label class="block text-xs font-medium text-slate-300 mb-1.5">Code PIN (4 chiffres)</label>
                <input type="password" id="qr-pin" maxlength="4" placeholder="••••"
                       class="w-full bg-slate-950/80 border border-slate-800 rounded-xl px-4 py-2.5 text-sm text-center font-mono tracking-widest focus:outline-none focus:border-blue-500 transition-colors">
            </div>
        </div>

        <div id="section-token" class="space-y-4 hidden">
            <div>
                <label class="block text-xs font-medium text-slate-300 mb-1.5">URL PRONOTE</label>
                <input type="url" id="token-url" placeholder="https://URL.index-education.net/pronote/eleve.html"
                       class="w-full bg-slate-950/80 border border-slate-800 rounded-xl px-3.5 py-2.5 text-xs focus:outline-none focus:border-blue-500 transition-colors">
            </div>
            <div>
                <label class="block text-xs font-medium text-slate-300 mb-1.5">Identifiant Unique</label>
                <input type="text" id="token-user" placeholder="prenom.nom"
                       class="w-full bg-slate-950/80 border border-slate-800 rounded-xl px-3.5 py-2.5 text-xs focus:outline-none focus:border-blue-500 transition-colors">
            </div>
            <div>
                <label class="block text-xs font-medium text-slate-300 mb-1.5">Jeton / Jeton de session</label>
                <input type="password" id="token-val" placeholder="Entrez le token PRONOTE"
                       class="w-full bg-slate-950/80 border border-slate-800 rounded-xl px-3.5 py-2.5 text-xs focus:outline-none focus:border-blue-500 transition-colors">
            </div>
        </div>

        <div id="section-cred" class="space-y-4 hidden">
            <div>
                <label class="block text-xs font-medium text-slate-300 mb-1.5">URL PRONOTE</label>
                <input type="url" id="cred-url" placeholder="https://URL.index-education.net/pronote/eleve.html"
                       class="w-full bg-slate-950/80 border border-slate-800 rounded-xl px-3.5 py-2.5 text-xs focus:outline-none focus:border-blue-500 transition-colors">
            </div>
            <div>
                <label class="block text-xs font-medium text-slate-300 mb-1.5">ENT</label>
                <select id="cred-ent" class="w-full bg-slate-950/80 border border-slate-800 rounded-xl px-3.5 py-2.5 text-xs focus:outline-none focus:border-blue-500 transition-colors">
                    <option value="monlycee_net">MonLycée.net (Île-de-France / Yvelines)</option>
                    <option value="ac_versailles">Académie de Versailles</option>
                    <option value="open_ent_ng">Open ENT NG</option>
                    <option value="">PRONOTE Direct (Sans ENT)</option>
                </select>
            </div>
            <div>
                <label class="block text-xs font-medium text-slate-300 mb-1.5">Identifiant</label>
                <input type="text" id="cred-user" placeholder="prenom.nom"
                       class="w-full bg-slate-950/80 border border-slate-800 rounded-xl px-3.5 py-2.5 text-xs focus:outline-none focus:border-blue-500 transition-colors">
            </div>
            <div>
                <label class="block text-xs font-medium text-slate-300 mb-1.5">Mot de passe</label>
                <input type="password" id="cred-pass" placeholder="••••••••"
                       class="w-full bg-slate-950/80 border border-slate-800 rounded-xl px-3.5 py-2.5 text-xs focus:outline-none focus:border-blue-500 transition-colors">
            </div>
        </div>

        <div class="mt-6 space-y-3">
            <button id="btn-export" onclick="startExport()"
                    class="w-full bg-blue-600 hover:bg-blue-500 text-white font-medium py-2.5 rounded-xl text-xs transition-all shadow-lg shadow-blue-600/20 active:scale-[0.98]">
                Exporter les données
            </button>

            <a id="btn-download" download="export_pronote.json"
               class="hidden w-full bg-emerald-600 hover:bg-emerald-500 text-white text-center font-medium py-2.5 rounded-xl text-xs transition-all shadow-lg shadow-emerald-600/20 active:scale-[0.98] block">
                Télécharger export_pronote.json
            </a>
        </div>

        <p id="status" class="mt-4 text-center text-xs text-slate-400 min-h-[1.25rem] transition-colors"></p>
    </div>

    <script>
        // UI state: track the active tab and cached QR payload processed from the uploaded image.
        let currentTab = 'qr';
        let extractedQRData = null;

        // Switch the visible form section while updating the active tab styling.
        function setTab(tab) {
            currentTab = tab;
            const tabs = ['qr', 'token', 'cred'];
            tabs.forEach(t => {
                const btn = document.getElementById(`btn-tab-${t}`);
                const sec = document.getElementById(`section-${t}`);
                if (t === tab) {
                    btn.className = "py-2 text-xs font-medium rounded-lg bg-blue-600 text-white transition-all duration-200";
                    sec.classList.remove('hidden');
                } else {
                    btn.className = "py-2 text-xs font-medium rounded-lg text-slate-400 hover:text-white transition-all duration-200";
                    sec.classList.add('hidden');
                }
            });
        }

        // Show feedback for the user while the app is processing login and export steps.
        function setStatus(text, isError = false) {
            const statusEl = document.getElementById('status');
            statusEl.innerText = text;
            statusEl.className = isError ? "mt-4 text-center text-xs text-red-400 font-medium" : "mt-4 text-center text-xs text-slate-300";
        }

        // Decode a QR code image using jsQR and store the extracted data for the backend call.
        function readQRCodeImage(input) {
            if (!input.files || !input.files[0]) return;
            const file = input.files[0];
            const reader = new FileReader();

            reader.onload = function(e) {
                const img = new Image();
                img.onload = function() {
                    const canvas = document.createElement('canvas');
                    const ctx = canvas.getContext('2d');
                    canvas.width = img.width;
                    canvas.height = img.height;
                    ctx.drawImage(img, 0, 0, img.width, img.height);

                    const imageData = ctx.getImageData(0, 0, img.width, img.height);
                    const code = jsQR(imageData.data, imageData.width, imageData.height);

                    if (code) {
                        try {
                            extractedQRData = JSON.parse(code.data);
                            setStatus("✅ Image QR Code lue avec succès !");
                        } catch (err) {
                            extractedQRData = code.data;
                            setStatus("✅ QR Code détecté !");
                        }
                    } else {
                        extractedQRData = null;
                        setStatus("❌ Impossible de déchiffrer le QR Code.", true);
                    }
                };
                img.src = e.target.result;
            };
            reader.readAsDataURL(file);
        }

        // Main request logic: validate form fields, call the correct endpoint, and save the export.
        async function startExport() {
            const btnExport = document.getElementById('btn-export');
            const btnDownload = document.getElementById('btn-download');
            btnDownload.classList.add('hidden');

            let endpoint = "";
            let payload = {};

            // QR mode requires an uploaded QR payload and a 4-digit PIN.
            if (currentTab === 'qr') {
                const pin = document.getElementById('qr-pin').value;
                if (!extractedQRData) {
                    setStatus("❌ Veuillez sélectionner un QR Code.", true);
                    return;
                }
                if (!pin || pin.length !== 4) {
                    setStatus("❌ Veuillez saisir votre code PIN à 4 chiffres.", true);
                    return;
                }
                endpoint = "/api/export/qrcode";
                payload = { qr_data: extractedQRData, pin: pin };

            // Token-based mode sends the PRONOTE URL, username, and session token to the backend.
            } else if (currentTab === 'token') {
                const url = document.getElementById('token-url').value;
                const user = document.getElementById('token-user').value;
                const token = document.getElementById('token-val').value;

                if (!url || !user || !token) {
                    setStatus("❌ Remplissez l'URL, l'identifiant et le jeton.", true);
                    return;
                }
                endpoint = "/api/export/token";
                payload = { url: url, username: user, token: token };

            // Manual credentials use the selected ENT/backend login mode when available.
            } else {
                const url = document.getElementById('cred-url').value;
                const user = document.getElementById('cred-user').value;
                const pass = document.getElementById('cred-pass').value;
                const entName = document.getElementById('cred-ent').value;

                if (!url || !user || !pass) {
                    setStatus("❌ Veuillez remplir tous les champs d'identifiants.", true);
                    return;
                }
                endpoint = "/api/export/credentials";
                payload = { url: url, username: user, password: pass, ent_name: entName || null };
            }

            btnExport.disabled = true;
            btnExport.classList.add('opacity-50');
            setStatus("⏳ Connexion en cours...");

            try {
                const res = await fetch(endpoint, {
                    method: 'POST',
                    headers: { 'Content-Type': 'application/json' },
                    body: JSON.stringify(payload)
                });

                if (!res.ok) {
                    const errorMsg = await res.json();
                    throw new Error(errorMsg.detail || "Erreur d'exportation.");
                }

                const jsonResult = await res.json();
                
                const dataStr = "data:text/json;charset=utf-8," + encodeURIComponent(JSON.stringify(jsonResult, null, 4));
                btnDownload.href = dataStr;
                btnDownload.classList.remove('hidden');

                setStatus("🎉 Données exportées avec succès !");
            } catch (err) {
                setStatus(`❌ ${err.message}`, true);
            } finally {
                btnExport.disabled = false;
                btnExport.classList.remove('opacity-50');
            }
        }
    </script>
</body>
</html>
